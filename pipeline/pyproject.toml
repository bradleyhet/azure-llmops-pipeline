[project]
name = "llmops-pipeline"
version = "0.1.0"
description = "Python tooling for the Corella assistant pipeline: canary readiness, promptfoo result scoring, full-run report rows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.11",
]

[project.scripts]
verify-revision = "llmops_pipeline.verify_revision:main"
parse-results = "llmops_pipeline.parse_results:main"
eval-report = "llmops_pipeline.report:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmops_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

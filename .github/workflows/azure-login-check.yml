name: Azure login check

# Proves the GitHub-to-Entra OIDC federation works with no stored Azure secret.
# Run by hand: gh workflow run azure-login-check.yml -f environment=dev

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose federated credential to use
        type: choice
        default: dev
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  login:
    name: OIDC login to Azure (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure login via federated credential
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show the resource group the pipeline is scoped to
        run: az group show --name "${{ vars.AZURE_RG }}" --output table

      - name: Show the identity we are running as
        run: az account show --query '{subscription:name, tenant:tenantId, user:user.name}' --output table

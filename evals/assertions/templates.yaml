# Shared assertions. Dataset rows reference these as
#   - $ref: "evals/assertions/templates.yaml#/faithful"
# (promptfoo resolves the path relative to the working directory, so run from the repo root).
# Threshold chosen from scripts/calibrate-judge.ts on 2026-09-14 with the overridden prompts
# (n=20, agreement 0.95, kappa 0.90, no false rejects, one false accept). See README, Methodology.
# That calibration used claude-sonnet-5. The judge moved to gpt-4.1-mini on 2026-09-24: re-grading
# the 95 saved responses of the 2026-09-23 nightly, it agreed with Sonnet on 158 of 163 judged
# assertions (every disagreement read against the corpus), and two re-grades matched on 162 of
# 163. The 0.7 thresholds were kept.
# The two grader prompts are overridden (statement extraction, then NLI): the stock prompts let
# the judge add preamble and inferred statements, each counted as an unsupported claim, which
# put every human-faithful answer between 0.33 and 0.75.
# Since 2026-11-19 the check runs three times and the median score decides
# (faithful-majority.ts calls promptfoo's own context-faithfulness matcher with the two prompt
# files above and the judge from defaultTest). A single verdict was not stable enough: the judge
# rejected one correct answer (gr-001) in 6 of 22 gate runs that day. See README, Methodology.
faithful:
  type: javascript
  value: file://evals/assertions/faithful-majority.ts
  config:
    votes: 3
    threshold: 0.7
# The stock context-recall prompt asks the judge to "think in steps", and on 2026-09-23/24 it
# twice replied without a single [Attributed] or [Not Attributed] token; promptfoo scores a
# reply with no tokens as 0, so a correct answer failed (gr-003 nightly, gr-007 canary).
# This prompt asks for one numbered line per sentence ending in the token and nothing else.
recallsExpected:
  type: context-recall
  value: "{{expected}}"
  threshold: 0.7
  rubricPrompt: file://evals/assertions/context-recall.txt
  contextTransform: 'output.context.join("\n\n")'
isRefusal:
  type: contains
  value: "I can't help with that request"
abstains:
  type: icontains
  value: "I don't have that information"
